version: 2

project_name: hopkit

builds:
  # macOS needs cgo for the native Keychain API (local device protection);
  # the release workflow therefore runs on a macOS runner.
  - id: hopkit-darwin
    main: ./cmd/hopkit
    binary: hopkit
    env: [CGO_ENABLED=1]
    goos: [darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/michael-ltm/hopkit/internal/commands.Version={{.Version}}
  - id: hopkit
    main: ./cmd/hopkit
    binary: hopkit
    env: [CGO_ENABLED=0]
    goos: [linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/michael-ltm/hopkit/internal/commands.Version={{.Version}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^ci:", "^chore:"]

brews:
  - name: hopkit
    repository:
      owner: michael-ltm
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/michael-ltm/hopkit"
    description: "AI-friendly SSH manager with a built-in MCP server"
    license: Apache-2.0
    install: |
      bin.install "hopkit"
    test: |
      system "#{bin}/hopkit", "version"

scoops:
  - repository:
      owner: michael-ltm
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
    homepage: "https://github.com/michael-ltm/hopkit"
    description: "AI-friendly SSH manager with a built-in MCP server"
    license: Apache-2.0

release:
  github:
    owner: michael-ltm
    name: hopkit
  draft: false
  prerelease: auto
